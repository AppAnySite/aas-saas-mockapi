x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &default-healthcheck
  interval: 30s
  timeout: 10s
  retries: 5

services:
  aas-saas-mockapi:
    image: aas-saas-mockapi:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aas-saas-mockapi
    restart: unless-stopped
    logging: *default-logging
    labels:
      maintainer: "AASTeam"
      com.maighamedia.service: "aas-saas-mockapi"
      prometheus.scrape: "true"
      prometheus.port: "${MOCKAPI_PORT:-3002}"
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: "256M"
        reservations:
          cpus: "0.15"
          memory: "128M"
    ports:
      - "${MOCKAPI_PORT:-3002}:${MOCKAPI_PORT:-3002}"
    env_file:
      - .config/env/.env.${NODE_ENV}
    networks:
      - my-network
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD","sh","-c","curl -f http://localhost:${MOCKAPI_PORT:-3002}/health"]
